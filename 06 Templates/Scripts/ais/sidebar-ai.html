<!DOCTYPE html>
<html>

<head>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: monospace;
    }

    html,
    body {
      background-color: #000000 !important;
      color: #e2e8f0;
      padding: 8px;
      font-size: 11px;
      height: 100%;
      overflow: hidden;
    }

    #container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    textarea {
      width: 100%;
      height: 42px;
      background-color: #09090b !important;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #ffffff !important;
      padding: 6px;
      resize: none;
      outline: none;
      font-size: 11px;
      font-family: monospace;
    }

    textarea:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 6px rgba(139, 92, 246, 0.4);
    }

    textarea::placeholder {
      color: #71717a;
    }

    #response {
      max-height: 120px;
      overflow-y: auto;
      background-color: #09090b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 6px;
      font-size: 11px;
      line-height: 1.4;
      white-space: pre-wrap;
      display: none;
      color: #38bdf8;
    }
  </style>
</head>

<body>
  <div id="container">
    <textarea id="prompt" placeholder="> Query mission control... (Enter to send)"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askAI();}"></textarea>
    <div id="response"></div>
  </div>

  <script>
    async function askAI() {
      const input = document.getElementById('prompt');
      const resBox = document.getElementById('response');
      const prompt = input.value.trim();
      if (!prompt) return;

      resBox.style.display = 'block';
      resBox.innerText = "Thinking...";
      input.value = "";

      try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "HTTP-Referer": "https://obsidian.md",
            "X-Title": "Obsidian Mission AI",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "poolside/laguna-s-2.1:free",
            messages: [{ role: "user", content: prompt }]
          })
        });

        const data = await res.json();

        if (!res.ok) {
          resBox.innerText = "API Error: " + (data.error?.message || res.statusText);
          return;
        }

        if (data.choices && data.choices[0]?.message?.content) {
          resBox.innerText = data.choices[0].message.content;
        } else {
          resBox.innerText = "No response text returned.";
        }
      } catch (e) {
        resBox.innerText = "Fetch Error: " + e.message;
      }
    }
  </script>
</body>

</html>
